# Local project layer. Uses the authenticated official Vibe CLI; no provider/key changes.
default_agent = "developer"
active_model = "zai-glm-5-3-flash"
enable_subagents = false
enable_background_processes = false
enable_telemetry = false
enable_mcp = false
enable_connectors = false
outside_workdir = "deny"

# Pin IDs without changing the existing authenticated Mistral provider.
# These presets declare routing, not account entitlement or pricing.
[[models]]
name = "mistral-large-4"
alias = "mistral-large-4"
provider = "mistral"

[[models]]
name = "zai-glm-5-3-flash"
alias = "zai-glm-5-3-flash"
provider = "mistral"

[[models]]
name = "mistral-small-2603"
alias = "mistral-small-2603"
provider = "mistral"

[[models]]
name = "zai-glm-5-3"
alias = "zai-glm-5-3"
provider = "mistral"
